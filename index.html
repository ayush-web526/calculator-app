<!DOCTYPE html><html><head><title>Calculator</title><style>body{background:#0f172a;display:flex;justify-content:center;padding-top:50px} .calc{background:#1e293b;padding:20px;border-radius:10px} input{width:100%;padding:10px;font-size:20px;margin-bottom:10px} button{width:60px;height:60px;margin:5px;font-size:20px}</style></head><body><div class="calc"><input id="res" disabled><br><button onclick="res.value+='7'">7</button><button onclick="res.value+='8'">8</button><button onclick="res.value+='9'">9</button><button onclick="res.value+='/'">/</button><br><button onclick="res.value+='4'">4</button><button onclick="res.value+='5'">5</button><button onclick="res.value+='6'">6</button><button onclick="res.value+='*'">*</button><br><button onclick="res.value+='1'">1</button><button onclick="res.value+='2'">2</button><button onclick="res.value+='3'">3</button><button onclick="res.value+='-'">-</button><br><button onclick="res.value=''">C</button><button onclick="res.value+='0'">0</button><button onclick="res.value=eval(res.value)">=</button><button onclick="res.value+='+'">+</button></div></body></html>
